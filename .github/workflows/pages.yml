name: Page de résultats

on:
  push:
    branches: [main]
    paths: ["results/**", "site/**", "src/vigenere_squad/evaluation/site.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Régénérer la page depuis results/metrics.json
        run: |
          uv sync --frozen
          uv run --frozen python data/preparer_donnees.py
          uv run --frozen vsquad metriques
          uv run --frozen vsquad site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
