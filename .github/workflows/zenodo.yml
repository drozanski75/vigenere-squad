name: Vérification Zenodo

# Retrouve l'archive Zenodo de la version demandée, calcule son SHA-256 et
# affiche le DOI (valeurs reportées dans la fiche de dépôt).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "version (tag)"
        default: "v1.0.0"
      enregistrement:
        description: "numéro d'enregistrement Zenodo (facultatif, ex. 24155159)"
        default: ""

jobs:
  zenodo:
    runs-on: ubuntu-24.04
    steps:
      - name: DOI et SHA-256 de l'archive Zenodo
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request, urllib.parse
          v = "${{ inputs.version }}"
          def chercher():
              vus = {}
              for q in ['"drozanski75/vigenere-squad"', 'vigenere-squad', 'Vigenère-Squad', 'creators.name:Rozanski']:
                  url = "https://zenodo.org/api/records?" + urllib.parse.urlencode(
                      {"q": q, "sort": "mostrecent", "size": 25, "all_versions": "true"})
                  for r in json.load(urllib.request.urlopen(url, timeout=60))["hits"]["hits"]:
                      vus[r["id"]] = r
              return list(vus.values())
          r = None
          if "${{ inputs.enregistrement }}":
              r = json.load(urllib.request.urlopen("https://zenodo.org/api/records/${{ inputs.enregistrement }}", timeout=60))
          for essai in range(0 if r else 20):  # Zenodo met quelques minutes à archiver une release
              recs = chercher()
              print("enregistrements :", [(x["metadata"].get("title", "")[:40], x["metadata"].get("version"), x.get("doi")) for x in recs])
              cand = [x for x in recs if x["metadata"].get("version") in (v, v.lstrip("v"))
                      and "igen" in x["metadata"].get("title", "").lower()]
              if cand:
                  r = cand[0]
                  break
              time.sleep(30)
          if r is None:
              raise SystemExit("enregistrement Zenodo introuvable pour " + v)
          f = r["files"][0]
          data = urllib.request.urlopen(f["links"]["self"], timeout=600).read()
          res = {"version": v, "doi": r["doi"], "doi_url": "https://doi.org/" + r["doi"], "record": r["links"]["html"],
                 "fichier": f["key"], "taille": len(data), "sha256": hashlib.sha256(data).hexdigest(),
                 "md5_zenodo": f.get("checksum")}
          print("RESULTAT", json.dumps(res))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write("\n".join(f"- **{k}** : `{x}`" for k, x in res.items()))
          PY
