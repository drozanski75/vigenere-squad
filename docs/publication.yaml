resume: >-
  Les chiffres classiques se cassent par une démarche en rôles : identifier le
  procédé, estimer la clé, valider le clair, expliquer. Vigenère-Squad confie
  ces rôles à cinq agents (Classifieur, Cryptanalyste, Linguiste, Pédagogue,
  Vérificateur) pilotés par un orchestrateur avec boucle de vérification et
  garde-fous ; un modèle local (Qwen3, Ollama, sans GPU) décide et explique,
  tandis que tous les calculs (IC, Kasiski, Friedman, χ², recuit simulé,
  attaque de l'autoclave) sont faits par du code testé. Une ablation sur 180
  chiffrés de six procédés compare une heuristique sans modèle à deux tailles
  de modèle, avec robustesse, défaillances et injection de consignes.
