[project]
name = "vigenere-squad"
version = "1.0.0"
description = "Système multi-agents (LLM local) qui casse les chiffrements classiques et explique sa démarche"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Dawid Rozanski" }]
keywords = ["cryptanalyse", "vigenere", "multi-agents", "llm", "ollama", "science-ouverte"]
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
  "py-minisign>=0.21",
  "psutil>=5.9",
]

[project.optional-dependencies]
demo = ["gradio>=4.40"]

[project.scripts]
vsquad = "vigenere_squad.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigenere_squad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["vigenere_squad.outils"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true
